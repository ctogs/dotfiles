unbind r
bind r source-file ~/.tmux.conf

# Cycle through sessions
bind k switch-client -n
bind j switch-client -p

set -g mouse on

# Smart pane switching with vim awareness (vim-tmux-navigator).
# C-h/j/k/l move between nvim splits and tmux panes seamlessly (no prefix needed).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Friendlier split bindings (open new panes in current dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Status bar visibility
set -g status on
set -g status-position top
set -g status-style 'bg=colour235 fg=colour255'

# Window tabs in status bar (like browser tabs)
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'bg=colour39 fg=colour232 bold'
set -g window-status-style 'bg=colour240 fg=colour250'

# Show all sessions on the right (clickable)
set -g status-right-length 120
set -g status-right '#(tmux list-sessions -F "#{?session_attached,#[bg=colour214 fg=colour232 bold],#[bg=colour240 fg=colour250]} #{session_name} ")'

# Current session on the left
set -g status-left ' [#S] '
set -g status-left-length 40
set -g status-left-style 'bg=colour214 fg=colour232 bold'
